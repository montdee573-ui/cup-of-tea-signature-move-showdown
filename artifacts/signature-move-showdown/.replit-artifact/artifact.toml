kind = "web"
previewPath = "/"
title = "Viral Reel"
description = "A free movie hub for legal, free-to-watch films worth sharing, with discovery, search, genre filters, watch links, and a personal list."
version = "1.0.0"
id = "artifacts/signature-move-showdown"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24206

[services.development]
run = "pnpm --filter @workspace/signature-move-showdown run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/signature-move-showdown", "run", "build" ]
serve = "static"
publicDir = "artifacts/signature-move-showdown/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24206"
BASE_PATH = "/"
