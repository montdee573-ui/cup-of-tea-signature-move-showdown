kind = "video"
videoAspectRatio = "9:16"
previewPath = "/champions-brew-loop/"
title = "The Champion’s Brew Loop"
description = "A vertical looping promotional film for Cup of Tea Signature Move Showdown, built with the campaign’s existing key art and motion graphics rather than paid generated video footage."
version = "1.0.0"
id = "artifacts/champions-brew-loop"
router = "path"

[[services]]
name = "web"
paths = [ "/champions-brew-loop/" ]
localPort = 20992

[services.development]
run = "pnpm --filter @workspace/champions-brew-loop run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/champions-brew-loop", "run", "build" ]
serve = "static"
publicDir = "artifacts/champions-brew-loop/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20992"
BASE_PATH = "/champions-brew-loop/"
