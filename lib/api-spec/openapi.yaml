openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: contest
    description: Signature Move Showdown contest operations
  - name: athletes
    description: Curated professional athlete signature-move cards
  - name: studio
    description: Owner-protected AI reel production studio
  - name: merch
    description: Read-only Printful catalog for merchandise planning
  - name: submissions
    description: Account-free move video submissions and owner moderation
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /contestants:
    get:
      operationId: listContestants
      tags: [contest]
      summary: List contest entries
      responses:
        "200":
          description: Contest entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contestant"
    post:
      operationId: createContestant
      tags: [contest]
      summary: Submit a signature move
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContestantInput"
      responses:
        "201":
          description: Contest entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contestant"
        "400":
          description: Invalid contest entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /contestants/{id}:
    get:
      operationId: getContestant
      tags: [contest]
      summary: Get a contest entry
      parameters:
        - $ref: "#/components/parameters/ContestantId"
      responses:
        "200":
          description: Contest entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contestant"
        "404":
          description: Contestant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /contest/summary:
    get:
      operationId: getContestSummary
      tags: [contest]
      summary: Get leaderboard summary
      responses:
        "200":
          description: Contest summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContestSummary"
  /move-cards:
    get:
      operationId: listMoveCards
      tags: [athletes]
      summary: List athlete move cards
      responses:
        "200":
          description: Curated athlete cards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MoveCard"
  /move-cards/{slug}:
    get:
      operationId: getMoveCard
      tags: [athletes]
      summary: Get an athlete move card
      parameters:
        - $ref: "#/components/parameters/MoveCardSlug"
      responses:
        "200":
          description: Athlete move card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoveCard"
        "404":
          description: Move card not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /community-cards:
    get:
      operationId: listCommunityCards
      tags: [submissions]
      summary: List approved participant cards
      responses:
        "200":
          description: Approved entries published in the community archive
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommunityCard"
  /community-cards/{id}:
    get:
      operationId: getCommunityCard
      tags: [submissions]
      summary: Get an approved participant card
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Approved participant card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityCard"
        "404":
          description: Approved card not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /community-cards/{id}/video:
    get:
      operationId: getCommunityCardVideo
      tags: [submissions]
      summary: Stream an approved participant video
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Approved video content
          content:
            video/mp4:
              schema:
                type: string
                format: binary
            video/webm:
              schema:
                type: string
                format: binary
            video/quicktime:
              schema:
                type: string
                format: binary
        "404":
          description: Approved video not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /showdowns:
    get:
      operationId: listShowdowns
      tags: [contest]
      summary: List free community matchups and results
      parameters:
        - name: voterToken
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Matchups with current vote counts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Showdown"
    post:
      operationId: createShowdown
      tags: [contest]
      summary: Create a free matchup from approved cards
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShowdownInput"
      responses:
        "201":
          description: Matchup created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Showdown"
        "400":
          description: Invalid card pairing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: This matchup already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Matchup creation rate limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /showdowns/{id}/votes:
    post:
      operationId: voteOnShowdown
      tags: [contest]
      summary: Cast one free vote in a matchup
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShowdownVoteInput"
      responses:
        "200":
          description: Vote accepted with updated results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShowdownResults"
        "400":
          description: Invalid vote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Matchup not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: This voter has already voted in this matchup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Voting rate limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /merch/catalog:
    get:
      operationId: listMerchCatalog
      tags: [merch]
      summary: List Printful products for planning
      description: Read-only catalog. Does not create or publish products.
      responses:
        "200":
          description: Printful catalog items available for planning
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MerchCatalogItem"
        "502":
          description: Printful catalog is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /studio/session:
    get:
      operationId: getStudioSession
      tags: [studio]
      summary: Check studio owner session
      responses:
        "200":
          description: Studio setup and session status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioSession"
    post:
      operationId: createStudioSession
      tags: [studio]
      summary: Sign in to the reel studio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudioLoginInput"
      responses:
        "200":
          description: Owner session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioSession"
        "401":
          description: Invalid studio password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteStudioSession
      tags: [studio]
      summary: Sign out of the reel studio
      responses:
        "204":
          description: Studio session cleared
  /studio/settings:
    get:
      operationId: getStudioSettings
      tags: [studio]
      summary: Read model and output settings
      responses:
        "200":
          description: Model, output, estimate, and workflow readiness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioSettings"
  /studio/reels:
    get:
      operationId: listStudioReels
      tags: [studio]
      summary: List generated reels and refresh active statuses
      responses:
        "200":
          description: Persisted reel runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioReelsResponse"
    post:
      operationId: createStudioReel
      tags: [studio]
      summary: Confirm and create a paid reel prediction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStudioReelInput"
      responses:
        "201":
          description: Reel prediction created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioReel"
        "400":
          description: Invalid settings or missing explicit cost confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Owner session required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Replicate, model, or storage is not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /studio/reels/{id}/video:
    get:
      operationId: getStudioReelVideo
      tags: [studio]
      summary: Stream a completed MP4 reel
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Stored MP4 video
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        "404":
          description: Reel video is not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /move-submissions:
    post:
      operationId: createMoveSubmission
      tags: [submissions]
      summary: Submit a move video for review
      parameters:
        - name: X-Submission-Metadata
          in: header
          required: true
          description: Base64url-encoded UTF-8 JSON matching MoveSubmissionInput
          schema:
            type: string
            maxLength: 4096
      requestBody:
        required: true
        content:
          video/mp4:
            schema:
              type: string
              format: binary
          video/webm:
            schema:
              type: string
              format: binary
          video/quicktime:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Video stored privately and submitted for moderation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoveSubmissionReceipt"
        "400":
          description: Invalid metadata, consent, or video type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Video exceeds the upload limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Upload rate or concurrency limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /studio/move-submissions/review:
    get:
      operationId: listMoveSubmissionsForReview
      tags: [submissions]
      summary: List pending submissions for the owner
      responses:
        "200":
          description: Private review queue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MoveSubmission"
        "401":
          description: Owner login required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /studio/move-submissions/{id}/review:
    patch:
      operationId: reviewMoveSubmission
      tags: [submissions]
      summary: Approve or reject a pending move submission
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveSubmissionReviewInput"
      responses:
        "200":
          description: Moderation decision saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoveSubmission"
        "401":
          description: Owner login required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Submission not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Submission has already been reviewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /studio/move-submissions/{id}/video:
    get:
      operationId: getMoveSubmissionVideo
      tags: [submissions]
      summary: Stream a private submission video for the owner
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Private video content
          content:
            video/mp4:
              schema:
                type: string
                format: binary
            video/webm:
              schema:
                type: string
                format: binary
            video/quicktime:
              schema:
                type: string
                format: binary
        "401":
          description: Owner login required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Submission video not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  parameters:
    ContestantId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    MoveCardSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ShowdownId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    MoveCard:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: string
        athleteName:
          type: string
        sport:
          type: string
        era:
          type: string
          enum: [Classic, Current]
        team:
          type: string
        moveName:
          type: string
        tagline:
          type: string
        explanation:
          type: string
        cues:
          type: array
          items:
            type: string
        sourceType:
          type: string
          enum: [user_clip, official]
        sourceLabel:
          type: string
        sourceUrl:
          type: ["string", "null"]
          format: uri
        coverImageUrl:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - slug
        - athleteName
        - sport
        - era
        - team
        - moveName
        - tagline
        - explanation
        - cues
        - sourceType
        - sourceLabel
        - sourceUrl
        - coverImageUrl
        - createdAt
    MerchCatalogItem:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        type:
          type: ["string", "null"]
        variantCount:
          type: integer
        imageUrl:
          type: ["string", "null"]
      required: [id, title, type, variantCount, imageUrl]
    Contestant:
      type: object
      properties:
        id:
          type: integer
        group:
          type: string
        handle:
          type: string
        signatureMove:
          type: string
        category:
          type: string
        verificationStatus:
          type: string
          enum: [Verified Clean, Pending Check, Needs Proof]
        coreVerdict:
          type: string
          enum: [Top Leaderboard, Challenge Cleared, Under Review, Not Cleared]
        overallFidelity:
          type: integer
          minimum: 0
          maximum: 100
        referenceClipUrl:
          type: ["string", "null"]
        visualProofName:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - group
        - handle
        - signatureMove
        - category
        - verificationStatus
        - coreVerdict
        - overallFidelity
        - referenceClipUrl
        - visualProofName
        - createdAt
    CommunityCard:
      type: object
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        handle:
          type: string
        sport:
          type: string
        category:
          type: string
        moveName:
          type: string
        team:
          type: ["string", "null"]
        design:
          type: string
          enum: [holo, court]
        createdAt:
          type: string
          format: date-time
        videoUrl:
          type: string
      required: [id, displayName, handle, sport, category, moveName, team, design, createdAt, videoUrl]
    ShowdownCard:
      type: object
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        handle:
          type: string
        sport:
          type: string
        moveName:
          type: string
        team:
          type: ["string", "null"]
        videoUrl:
          type: string
      required: [id, displayName, handle, sport, moveName, team, videoUrl]
    Showdown:
      type: object
      properties:
        id:
          type: integer
        mode:
          type: string
          enum: [sport, exhibition]
        left:
          $ref: "#/components/schemas/ShowdownCard"
        right:
          $ref: "#/components/schemas/ShowdownCard"
        leftVotes:
          type: integer
        rightVotes:
          type: integer
        myVoteEntryId:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required: [id, mode, left, right, leftVotes, rightVotes, myVoteEntryId, createdAt]
    ShowdownResults:
      type: object
      properties:
        showdownId:
          type: integer
        leftVotes:
          type: integer
        rightVotes:
          type: integer
        myVoteEntryId:
          type: string
          format: uuid
      required: [showdownId, leftVotes, rightVotes, myVoteEntryId]
    ShowdownInput:
      type: object
      properties:
        firstEntryId:
          type: string
          format: uuid
        secondEntryId:
          type: string
          format: uuid
        mode:
          type: string
          enum: [sport, exhibition]
      required: [firstEntryId, secondEntryId, mode]
    ShowdownVoteInput:
      type: object
      properties:
        entryId:
          type: string
          format: uuid
        voterToken:
          type: string
          format: uuid
      required: [entryId, voterToken]
    ContestantInput:
      type: object
      properties:
        handle:
          type: string
          minLength: 2
        signatureMove:
          type: string
          minLength: 2
        category:
          type: string
          enum: [Male, Female, Open]
        referenceClipUrl:
          type: string
          format: uri
        visualProofName:
          type: ["string", "null"]
      required:
        - handle
        - signatureMove
        - category
        - referenceClipUrl
    ContestSummary:
      type: object
      properties:
        totalEntries:
          type: integer
        verifiedEntries:
          type: integer
        pendingEntries:
          type: integer
        averageFidelity:
          type: integer
        topMove:
          type: string
        leaderboard:
          type: array
          items:
            $ref: "#/components/schemas/Contestant"
      required:
        - totalEntries
        - verifiedEntries
        - pendingEntries
        - averageFidelity
        - topMove
        - leaderboard
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    StudioSession:
      type: object
      properties:
        configured:
          type: boolean
        authenticated:
          type: boolean
      required: [configured, authenticated]
    StudioLoginInput:
      type: object
      properties:
        password:
          type: string
          minLength: 1
      required: [password]
    StudioSettings:
      type: object
      properties:
        model:
          type: string
        durationOptions:
          type: array
          items:
            type: integer
        aspectRatio:
          type: string
        resolution:
          type: string
        audioEnabled:
          type: boolean
        costPerSecondUsd:
          type: number
        storageReady:
          type: boolean
        providerReady:
          type: boolean
        firstTestPassed:
          type: boolean
        canGenerate:
          type: boolean
        message:
          type: string
      required:
        - model
        - durationOptions
        - aspectRatio
        - resolution
        - audioEnabled
        - costPerSecondUsd
        - storageReady
        - providerReady
        - firstTestPassed
        - canGenerate
        - message
    CreateStudioReelInput:
      type: object
      properties:
        briefId:
          type: string
          enum: [performance, premium-card, card-showdown, enter-vote, merch-tease]
        durationSeconds:
          type: integer
          enum: [4, 6, 8]
        model:
          type: string
        aspectRatio:
          type: string
          enum: ["9:16"]
        resolution:
          type: string
          enum: ["720p"]
        audioEnabled:
          type: boolean
          enum: [true]
        estimatedCostUsd:
          type: number
          minimum: 0.01
        confirmCost:
          type: boolean
          enum: [true]
      required:
        - briefId
        - durationSeconds
        - model
        - aspectRatio
        - resolution
        - audioEnabled
        - estimatedCostUsd
        - confirmCost
    StudioReel:
      type: object
      properties:
        id:
          type: integer
        briefId:
          type: string
        title:
          type: string
        status:
          type: string
          enum: [starting, processing, succeeded, failed, aborted]
        model:
          type: string
        durationSeconds:
          type: integer
        aspectRatio:
          type: string
        resolution:
          type: string
        audioEnabled:
          type: boolean
        estimatedCostUsd:
          type: number
        isTest:
          type: boolean
        videoUrl:
          type: ["string", "null"]
        error:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - briefId
        - title
        - status
        - model
        - durationSeconds
        - aspectRatio
        - resolution
        - audioEnabled
        - estimatedCostUsd
        - isTest
        - videoUrl
        - error
        - createdAt
    StudioReelsResponse:
      type: object
      properties:
        reels:
          type: array
          items:
            $ref: "#/components/schemas/StudioReel"
        firstTestPassed:
          type: boolean
      required: [reels, firstTestPassed]
    MoveSubmissionInput:
      type: object
      properties:
        sport:
          type: string
          minLength: 1
          maxLength: 50
        category:
          type: string
          enum: [Open, "Men's", "Women's", Mixed]
        moveName:
          type: string
          minLength: 1
          maxLength: 60
        displayName:
          type: string
          minLength: 1
          maxLength: 50
        handle:
          type: string
          minLength: 1
          maxLength: 30
        team:
          type: string
          maxLength: 60
        videoFileName:
          type: string
          maxLength: 150
        design:
          type: string
          enum: [holo, court]
        consent:
          type: boolean
          enum: [true]
      required: [sport, category, moveName, displayName, handle, design, consent]
    MoveSubmissionReceipt:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending]
        createdAt:
          type: string
          format: date-time
