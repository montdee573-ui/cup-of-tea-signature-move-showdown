openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: contest
    description: Signature Move Showdown contest operations
  - name: athletes
    description: Curated professional athlete signature-move cards
  - name: studio
    description: Owner-protected AI reel production studio
  - name: merch
    description: Printful catalog and owner-only merchandise mockup previews
  - name: submissions
    description: Account-free move video submissions and owner moderation
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /contestants:
    get:
      operationId: listContestants
      tags: [contest]
      summary: List contest entries
      responses:
        "200":
          description: Contest entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contestant"
    post:
      operationId: createContestant
      tags: [contest]
      summary: Submit a signature move
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContestantInput"
      responses:
        "201":
          description: Contest entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contestant"
        "400":
          description: Invalid contest entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /contestants/{id}:
    get:
      operationId: getContestant
      tags: [contest]
      summary: Get a contest entry
      parameters:
        - $ref: "#/components/parameters/ContestantId"
      responses:
        "200":
          description: Contest entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contestant"
        "404":
          description: Contestant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /contest/summary:
    get:
      operationId: getContestSummary
      tags: [contest]
      summary: Get leaderboard summary
      responses:
        "200":
          description: Contest summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContestSummary"
  /move-cards:
    get:
      operationId: listMoveCards
      tags: [athletes]
      summary: List athlete move cards
      responses:
        "200":
          description: Curated athlete cards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MoveCard"
  /move-cards/{slug}:
    get:
      operationId: getMoveCard
      tags: [athletes]
      summary: Get an athlete move card
      parameters:
        - $ref: "#/components/parameters/MoveCardSlug"
      responses:
        "200":
          description: Athlete move card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoveCard"
        "404":
          description: Move card not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /community-cards:
    get:
      operationId: listCommunityCards
      tags: [submissions]
      summary: List approved participant cards
      responses:
        "200":
          description: Approved entries published in the community archive
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommunityCard"
  /community-cards/{id}:
    get:
      operationId: getCommunityCard
      tags: [submissions]
      summary: Get an approved participant card
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Approved participant card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityCard"
        "404":
          description: Approved card not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /community-cards/{id}/video:
    get:
      operationId: getCommunityCardVideo
      tags: [submissions]
      summary: Stream an approved participant video
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Approved video content
          content:
            video/mp4:
              schema:
                type: string
                format: binary
            video/webm:
              schema:
                type: string
                format: binary
            video/quicktime:
              schema:
                type: string
                format: binary
        "404":
          description: Approved video not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /showdowns:
    get:
      operationId: listShowdowns
      tags: [contest]
      summary: List free community matchups and results
      parameters:
        - name: voterToken
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Matchups with current vote counts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Showdown"
    post:
      operationId: createShowdown
      tags: [contest]
      summary: Create a free matchup from approved cards
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShowdownInput"
      responses:
        "201":
          description: Matchup created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Showdown"
        "400":
          description: Invalid card pairing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: This matchup already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Matchup creation rate limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /showdowns/{id}/votes:
    post:
      operationId: voteOnShowdown
      tags: [contest]
      summary: Cast one free vote in a matchup
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShowdownVoteInput"
      responses:
        "200":
          description: Vote accepted with updated results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShowdownResults"
        "400":
          description: Invalid vote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Matchup not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: This voter has already voted in this matchup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Voting rate limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /studio/contest-results:
    get:
      operationId: listStudioContestResults
      tags: [studio]
      summary: List owner-only draft and cleared contest results
      responses:
        "200":
          description: Contest result records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContestResult"
        "401":
          description: Owner session required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createStudioContestResult
      tags: [studio]
      summary: Save a manually verified contest result as a draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContestResultInput"
      responses:
        "201":
          description: Draft result saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContestResult"
        "400":
          description: Invalid result details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Owner session required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /studio/contest-results/{id}/clear:
    post:
      operationId: clearStudioContestResult
      tags: [studio]
      summary: Clear a draft as an official contest result
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContestResultClearanceInput"
      responses:
        "200":
          description: Official result cleared by owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContestResult"
        "400":
          description: Confirmation or result is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Owner session required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Draft result not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Result is tied or already cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /merch/catalog:
    get:
      operationId: listMerchCatalog
      tags: [merch]
      summary: List Printful products for planning
      description: Read-only catalog. Does not create or publish products.
      responses:
        "200":
          description: Printful catalog items available for planning
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MerchCatalogItem"
        "502":
          description: Printful catalog is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /merch/catalog/{id}/details:
    get:
      operationId: getMerchProductDetails
      tags: [merch]
      summary: Get catalog variants and print placements
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Catalog product details for private mockup planning
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchProductDetails"
        "401":
          description: Owner session required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Catalog product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Printful product details are unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /merch/catalog/{id}/mockups:
    post:
      operationId: createMerchMockup
      tags: [merch]
      summary: Generate a private mockup from artwork
      description: Creates only a temporary Printful mockup-generation task. Does not create a product, order, or checkout.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MerchMockupInput"
      responses:
        "200":
          description: Printful mockup-generation task started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchMockupTaskStart"
        "400":
          description: Invalid variant, placement, or artwork URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Owner session required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Catalog product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Printful could not start mockup generation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /merch/mockups/{taskKey}:
    get:
      operationId: getMerchMockupTask
      tags: [merch]
      summary: Check a private mockup task
      parameters:
        - name: taskKey
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        "200":
          description: Mockup task state and any generated previews
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchMockupTask"
        "401":
          description: Owner session required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Printful could not read the mockup task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /studio/session:
    get:
      operationId: getStudioSession
      tags: [studio]
      summary: Check studio owner session
      responses:
        "200":
          description: Studio setup and session status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioSession"
    post:
      operationId: createStudioSession
      tags: [studio]
      summary: Sign in to the reel studio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudioLoginInput"
      responses:
        "200":
          description: Owner session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioSession"
        "401":
          description: Invalid studio password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteStudioSession
      tags: [studio]
      summary: Sign out of the reel studio
      responses:
        "204":
          description: Studio session cleared
  /studio/settings:
    get:
      operationId: getStudioSettings
      tags: [studio]
      summary: Read model and output settings
      responses:
        "200":
          description: Model, output, estimate, and workflow readiness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioSettings"
  /studio/reels:
    get:
      operationId: listStudioReels
      tags: [studio]
      summary: List generated reels and refresh active statuses
      responses:
        "200":
          description: Persisted reel runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioReelsResponse"
    post:
      operationId: createStudioReel
      tags: [studio]
      summary: Confirm and create a paid reel prediction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStudioReelInput"
      responses:
        "201":
          description: Reel prediction created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioReel"
        "400":
          description: Invalid settings or missing explicit cost confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Owner session required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Replicate, model, or storage is not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /studio/reels/{id}/video:
    get:
      operationId: getStudioReelVideo
      tags: [studio]
      summary: Stream a completed MP4 reel
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Stored MP4 video
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        "404":
          description: Reel video is not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /move-submissions:
    post:
      operationId: createMoveSubmission
      tags: [submissions]
      summary: Submit a move video for review
      parameters:
        - name: X-Submission-Metadata
          in: header
          required: true
          description: Base64url-encoded UTF-8 JSON matching MoveSubmissionInput
          schema:
            type: string
            maxLength: 4096
      requestBody:
        required: true
        content:
          video/mp4:
            schema:
              type: string
              format: binary
          video/webm:
            schema:
              type: string
              format: binary
          video/quicktime:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Video stored privately and submitted for moderation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoveSubmissionReceipt"
        "400":
          description: Invalid metadata, consent, or video type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Video exceeds the upload limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Upload rate or concurrency limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /creator-cards/{id}/access:
    post:
      operationId: getCreatorCardAccess
      tags: [submissions]
      summary: Load a private creator card and verify its motion-card purchase
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatorCardAccessInput"
      responses:
        "200":
          description: Private creator card status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorCardAccessResponse"
        "403":
          description: Creator link is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Submission not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many private access checks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Payment status could not be verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /creator-cards/{id}/checkout:
    post:
      operationId: createCreatorMotionCardCheckout
      tags: [submissions]
      summary: Create a hosted checkout for an optional motion card
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatorCardAccessInput"
      responses:
        "200":
          description: Existing verified purchase or hosted checkout link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorMotionCheckoutResponse"
        "403":
          description: Creator link is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Submission not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Submission is not approved for a motion-card purchase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Motion-card checkout is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many checkout requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /studio/move-submissions/review:
    get:
      operationId: listMoveSubmissionsForReview
      tags: [submissions]
      summary: List pending submissions for the owner
      responses:
        "200":
          description: Private review queue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MoveSubmission"
        "401":
          description: Owner login required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /studio/move-submissions/{id}/review:
    patch:
      operationId: reviewMoveSubmission
      tags: [submissions]
      summary: Approve or reject a pending move submission
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveSubmissionReviewInput"
      responses:
        "200":
          description: Moderation decision saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoveSubmission"
        "401":
          description: Owner login required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Submission not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Submission has already been reviewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /studio/move-submissions/{id}/video:
    get:
      operationId: getMoveSubmissionVideo
      tags: [submissions]
      summary: Stream a private submission video for the owner
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Private video content
          content:
            video/mp4:
              schema:
                type: string
                format: binary
            video/webm:
              schema:
                type: string
                format: binary
            video/quicktime:
              schema:
                type: string
                format: binary
        "401":
          description: Owner login required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Submission video not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  parameters:
    ContestantId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    MoveCardSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ShowdownId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    MoveCard:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: string
        athleteName:
          type: string
        sport:
          type: string
        era:
          type: string
          enum: [Classic, Current]
        team:
          type: string
        moveName:
          type: string
        tagline:
          type: string
        explanation:
          type: string
        cues:
          type: array
          items:
            type: string
        sourceType:
          type: string
          enum: [user_clip, official]
        sourceLabel:
          type: string
        sourceUrl:
          type: ["string", "null"]
          format: uri
        coverImageUrl:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - slug
        - athleteName
        - sport
        - era
        - team
        - moveName
        - tagline
        - explanation
        - cues
        - sourceType
        - sourceLabel
        - sourceUrl
        - coverImageUrl
        - createdAt
    MerchCatalogItem:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        type:
          type: ["string", "null"]
        variantCount:
          type: integer
        imageUrl:
          type: ["string", "null"]
      required: [id, title, type, variantCount, imageUrl]
    MerchProductVariant:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        color:
          type: ["string", "null"]
        size:
          type: ["string", "null"]
      required: [id, name, color, size]
    MerchPrintPlacement:
      type: object
      properties:
        id:
          type: string
